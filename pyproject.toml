[project]
name = "contextlayer"
version = "0.1.0"
description = "A context layer for AI agents on SurrealDB: retrieval, memory, graph and access control in one database."
readme = "README.md"
authors = [
    { email = "tanishqdiscord@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "anthropic>=1.13.0",
    "fastembed>=0.9.0",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
    "surrealdb>=2.0.0",
]

[project.scripts]
ctx = "contextlayer.cli:main"

[build-system]
requires = ["uv_build>=0.11.17,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
